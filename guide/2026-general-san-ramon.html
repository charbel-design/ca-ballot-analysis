sh denser housing into the suburbs. That works against a preference for more homes. Bauer-Kahan’s campaign, as a San Ramon news guide describes it, does not make that argument. The guide is thinner than the statewide sources.", "ballot": "Rebecca Bauer-Kahan (Democratic, Assemblymember) and Joseph A. Rubay (Republican, Businessman/Father).", "how": "Policy is only 50 against 40. Her lead is not a detailed housing-bill record. Consent-calendar votes were not treated as a platform. Policy alignment, not the incumbency cells, is the larger share of the 8.20-point gap: about 4.5 points from policy and about 3.2 from feasibility. Feasibility is 75 against 30 because she is the incumbent in a Democratic district, and that weight is 7 percent.", "publicHow": "Policy is only 50 against 40. Her lead is not a detailed housing-bill record. Consent-calendar votes were not treated as a platform. Feasibility is 75 against 30 because she is the incumbent in a Democratic district.", "sens": "0 of 14 default-weight shifts change the leader. The narrowest is feasibility at −10, clipped to 0: Bauer-Kahan 48.87, Rubay 43.44, gap 5.43.", "settle": "", "extra": "Bauer-Kahan: 22.50 + 7.50 + 5.40 + 5.00 + 2.80 + 5.25 + 2.25 = 50.70", "sources": [{"t": "San Ramon Patch voter guide", "h": "https://patch.com/california/sanramon/san-ramon-voter-guide-2026-whats-ballot-voting-more"}, {"t": "Certified candidate list", "h": "https://elections.cdn.sos.ca.gov/statewide-elections/2026-general/cert-list-candidates.pdf"}]}, {"id": "spi", "tab": "offices", "kind": "race", "office": "Superintendent of public instruction", "pick": "Shaw", "conf": "Medium", "ownerWhy": "Shaw says schools should get back to academic basics. Barrera’s priority is more school funding and an easier path into teaching, and the teachers union’s endorsement is what made him widely known. The office is nonpartisan, and in 2027 a governor-appointed commissioner takes over the department.", "publicWhy": "Shaw says schools should get back to academic basics. Barrera’s priority is more school funding and an easier path into teaching, and the teachers union’s endorsement is what made him widely known. The office is nonpartisan, and in 2027 a governor-appointed commissioner takes over the department.", "ballot": "Richard Barrera (State Superintendent Advisor) and Sonja Shaw (School District President). Nonpartisan. The office loses department control in 2027 to a governor-appointed education commissioner and keeps a statewide platform.", "how": "Policy is 60 against 40. The transgender-student fight is part of Shaw’s public record and is not the whole score. Academic basics against a union-backed funding agenda is the core. Concentrated benefit is 55 against 30 because of that California Teachers Association endorsement. Delivery is 40 for both: a school-board presidency is not, by itself, a statewide result.", "publicHow": "Policy is 60 against 40. The transgender-student fight is part of Shaw’s public record and is not the whole score. Academic basics against a union-backed funding agenda is the core. Concentrated benefit is 55 against 30 because of that California Teachers Association endorsement. Delivery is 40 for both: a school-board presidency is not, by itself, a statewide result.", "sens": "0 of 14 default-weight shifts change the leader. The narrowest is feasibility at +10: Shaw 55.82, Barrera 43.95, gap 11.86.", "settle": "", "extra": "Barrera: 18.00 + 6.75 + 3.60 + 4.50 + 3.20 + 4.20 + 2.10 = 42.35", "sources": [{"t": "CalMatters superintendent guide", "h": "https://calmatters.org/california-voter-guide-2026/superintendent-of-public-instruction/"}, {"t": "Certified candidate list", "h": "https://elections.cdn.sos.ca.gov/statewide-elections/2026-general/cert-list-candidates.pdf"}]}, {"id": "judicial", "tab": "offices", "kind": "static", "office": "Judicial retention", "pick": "No pick", "conf": "", "ownerWhy": "No pick. Supreme Court justices Kelli M. Evans and Joshua Groban are on every ballot, along with the First Appellate District justices named on the certified list. Their opinions were not read. This is not a vote to keep them and not a vote to remove them.", "publicWhy": "No pick. Supreme Court justices Kelli M. Evans and Joshua Groban are on every ballot, along with the First Appellate District justices named on the certified list. Their opinions were not read. This is not a vote to keep them and not a vote to remove them.", "ballot": "Supreme Court: Kelli M. Evans and Joshua Groban. First Appellate District: Charles A. Smiley, Kathleen M. Banke, and Monique Langhorne Wilson (Division One); Presiding Justice Therese M. Stewart and Tara M. Desautels (Division Two); Ioana Petrou and Victor A. Rodriguez (Division Three); Presiding Justice Tracie L. Brown (Division Four); Mark Simons, Danny Y. Chou, and Gordon Burns (Division Five).", "how": "", "publicHow": "", "sens": "", "settle": "What would settle it. Read the opinions or the official voter-guide judicial section.", "extra": "", "sources": [{"t": "Certified candidate list", "h": "https://elections.cdn.sos.ca.gov/statewide-elections/2026-general/cert-list-candidates.pdf"}]}, {"id": "mayor", "tab": "local", "kind": "static", "office": "San Ramon mayor", "pick": "No pick", "conf": "", "ownerWhy": "No pick. The citywide ballot lists Emma Chigbu, Mark H. Armstrong, and Paschalis Ntatsos. Job titles are not a record, and the candidates’ answers were not in the page used here.", "publicWhy": "No pick. The citywide ballot lists Emma Chigbu, Mark H. Armstrong, and Paschalis Ntatsos. Job titles are not a record, and the candidates’ answers were not in the page used here.", "ballot": "Citywide. Emma Chigbu (Student), Mark H. Armstrong (Mayor/Retired Colonel), and Paschalis Ntatsos (Nonprofit Director/CEO).", "how": "", "publicHow": "", "sens": "", "settle": "What would settle it. Those answers, read against the framework, would settle a score. The office itself is on every San Ramon ballot.", "extr here only if your address is in District 4.", "how": "", "publicHow": "", "sens": "", "settle": "What would settle it. Confirm the district, then read the answers Patch collected. They were not in the guide page used here.", "extra": "", "sources": [{"t": "County contest list", "h": "https://www.contracostavote.gov/wp-content/uploads/8-27-26_candidatelist_detail_final.pdf"}, {"t": "City district lookup", "h": "https://www.sanramon.ca.gov/findyourdistrict"}, {"t": "San Ramon Patch voter guide", "h": "https://patch.com/california/sanramon/san-ramon-voter-guide-2026-whats-ballot-voting-more"}]}, {"id": "srvusd", "tab": "local", "kind": "static", "office": "San Ramon Valley Unified, Area 5", "pick": "No pick", "conf": "", "ownerWhy": "No pick, and only if you live in Trustee Area 5: Rachel Hurd or Joel Woods. A local guide describes Area 5 as eastern and southeastern San Ramon, around Dougherty Valley. Area 1 (Amanda Butland) and Area 4 (Susanna Ordway) have one name each. Many 94582 addresses are not in Area 5.", "publicWhy": "No pick, and only if you live in Trustee Area 5: Rachel Hurd or Joel Woods. A local guide describes Area 5 as eastern and southeastern San Ramon, around Dougherty Valley. Area 1 (Amanda Butland) and Area 4 (Susanna Ordway) have one name each. Many 94582 addresses are not in Area 5.", "ballot": "Rachel Hurd (incumbent since 2006, seeking a fifth term) and Joel Woods (substitute teacher), if your address is in Area 5. Patch describes Area 5 as eastern and southeastern San Ramon, centered on Dougherty Valley. Area 1 has one candidate, Amanda Butland. Area 4 has one candidate, incumbent Susanna Ordway. ZIP 94582 includes Dougherty Valley and older San Ramon, so many 94582 voters are not in Area 5.", "how": "", "publicHow": "", "sens": "", "settle": "What would settle it. Confirm the trustee area on the district map and the sample ballot, then read Hurd’s and Woods’s answers.", "extra": "", "sources": [{"t": "County contest list", "h": "https://www.contracostavote.gov/wp-content/uploads/8-27-26_candidatelist_detail_final.pdf"}, {"t": "SRVUSD trustee-area map", "h": "https://www.srvusd.net/documents/About-Us/Board-of-Education/Redistricting/New-Trustee-Area-Map-Adopted-2-22-2022.pdf"}, {"t": "San Ramon Patch voter guide", "h": "https://patch.com/california/sanramon/san-ramon-voter-guide-2026-whats-ballot-voting-more"}]}, {"id": "dsrsd", "tab": "local", "kind": "static", "office": "Dublin San Ramon Services District, Division 2", "pick": "No pick", "conf": "", "ownerWhy": "No pick. Kismat Kathrani and Donald Downey are the names if your address is in Division 2. This ZIP was not matched to a division. If the race is not on your sample ballot, you do not have it.", "publicWhy": "No pick. Kismat Kathrani and Donald Downey are the names if your address is in Division 2. This ZIP was not matched to a division. If the race is not on your sample ballot, you do not have it.", "ballot": "Kismat Kathrani (Technology Business Owner) and Donald Downey (Registered Geologist), if your address is in Division 2. This pass did not confirm that a 94582 household is in that division.", "how": "", "publicHow": "", "sens": "", "settle": "What would settle it. The sample ballot is the check. If Division 2 is not on it, you do not have this contest.", "extra": "", "sources": [{"t": "County contest list", "h": "https://www.contracostavote.gov/wp-content/uploads/8-27-26_candidatelist_detail_final.pdf"}]}, {"id": "prop1", "tab": "measures", "kind": "measure", "office": "Proposition 1", "pick": "No", "conf": "Medium", "ownerWhy": "The state would borrow $11.25 billion, mostly for affordable housing, plus help for veterans buying a home, farm, or mobilehome. Taxpayers pay that debt back for years. More housing is a real reason to vote yes, which is why this is Medium rather than a firmer no.", "publicWhy": "The state would borrow $11.25 billion, mostly for affordable housing, plus help for veterans buying a home, farm, or mobilehome. Taxpayers pay that debt back for years. More housing is a reason the other way, so the measure tests land on No, at Medium rather than a firmer no.", "ballot": "", "how": "", "publicHow": "", "sens": "", "settle": "", "extra": "Legislative statute. Official summaries used here are paraphrases of the Secretary of State’s June 29, 2026 numbering release. A local guide’s “about 40,000 homes” figure is not treated as the legislative analyst’s estimate.", "sources": [{"t": "Numbering release", "h": "https://www.sos.ca.gov/administration/news-releases-and-advisories/2026-news-releases-and-advisories/secretary-state-shirley-n-weber-phd-assigns-numbers-november-ballot-measures-invites-ballot-arguments"}, {"t": "Qualified measures", "h": "https://www.sos.ca.gov/elections/ballot-measures/qualified-ballot-measures"}]}, {"id": "prop2", "tab": "measures", "kind": "measure", "office": "Proposition 2", "pick": "Yes", "conf": "Medium", "ownerWhy": "This raises the cap on the state’s rainy-day fund from 10 percent of tax revenue to 20 percent. That is savings, not a new tax. It also makes it easier to declare a budget emergency, which keeps this at Medium.", "publicWhy": "This raises the cap on the state’s rainy-day fund from 10 percent of tax revenue to 20 percent. That is savings, not a new tax. It also makes it easier to declare a budget emergency, which keeps the measure tests at Medium.", "ballot": "", "how": "", "publicHow": "", "sens": "", "settle": "", "extra": "Legislative constitutional amendment. The qualified-list title is an increase in the state’s rainy-day fund. This pick follows the amendment text in the numbering release, not a shorthand that the state may save “10 percent more.”", "sources": [{"t": "Numbering release", "h": "https://www.sos.ca.gov/administration/news-releases-and-advisories/2026-news-releases-and-advisories/secretary-state-shirley-n-weber-phd-assigns-numbers-november-ballot-measures-invites-ballot-arguments"}, {"t": "Qualified measures", "h": "https://www.sos.ca.gov/elections/ballot-measures/qualified-ballot-measures"}]}, {"id": "prop3", "tab": "measures", "kind": "measure", "office": "Proposition 3", "pick": "No", "conf": "Medium", "ownerWhy": "The extra tax on high incomes, now set to end in 2031, would become permanent and keep about $5 billion to $15 billion a year, mostly for schools. A tax that never expires fails the bar this voter sets. The payers are high earners, so this is Medium.", "publicWhy": "The extra tax on high incomes, now set to end in 2031, would become permanent and keep about $5 billion to $15 billion a year, mostly for schools. A tax that never expires fails the framework’s bar. The payers are high earners, so this is Medium.", "ballot": "", "how": "", "publicHow": "", "sens": "", "settle": "", "extra": "Initiative constitutional amendment. Thresholds in the summary are about $360,000 for single filers, $721,000 for joint filers, and $490,000 for heads of household, in 2024 dollars.", "sources": [{"t": "Numbering release", "h": "https://www.sos.ca.gov/administration/news-releases-and-advisories/2026-news-releases-and-advisories/secretary-state-shirley-n-weber-phd-assigns-numbers-november-ballot-measures-invites-ballot-arguments"}, {"t": "Qualified measures", "h": "https://www.sos.ca.gov/elections/ballot-measures/qualified-ballot-measures"}]}, {"id": "prop4", "tab": "measures", "kind": "measure", "office": "Proposition 4", "pick": "No", "conf": "Medium", "ownerWhy": "Government could spend public money on campaigns for office. You would help pay for candidates you oppose. Supporters say that would make candidates less dependent on big donors, which is why this is Medium.", "publicWhy": "Government could spend public money on campaigns for office. People would help pay for candidates they oppose. Supporters say that would make candidates less dependent on big donors, which is why this is Medium.", "ballot": "", "how": "", "publicHow": "", "sens": "", "settle": "", "extra": "Legislative statute. This pass did not review the campaign’s funders.", "sources": [{"t": "Numbering release", "h": "https://www.sos.ca.gov/administration/news-releases-and-advisories/2026-news-releases-and-advisories/secretary-state-shirley-n-weber-phd-assigns-numbers-november-ballot-measures-invites-ballot-arguments"}, {"t": "Qualified measures", "h": "https://www.sos.ca.gov/elections/ballot-measures/qualified-ballot-measures"}]}, {"id": "prop5", "tab": "measures", "kind": "measure", "office": "Proposition 5", "pick": "Yes", "conf": "Low", "ownerWhy": "If voters recall a statewide officer, they would no longer pick the replacement on the same ballot. The job would be filled the way a vacancy usually is. That drops a messy side election. I am not confident. Push back if you want the replacement chosen the same day.", "publicWhy": "If voters recall a statewide officer, they would no longer pick the replacement on the same ballot. The job would be filled the way a vacancy usually is. That drops a side election. Confidence is low. The open question is whether the replacement should be chosen the same day.", "ballot": "", "how": "", "publicHow": "", "sens": "", "settle": "What would settle it. Whether you want the successor chosen on the same ballot.", "extra": "Legislative constitutional amendment. If the governor is recalled, the lieutenant governor serves the rest of the term, with a special election in the first two years if the recall falls before the next nomination period closes. The recalled officer cannot be appointed to the vacancy.", "sources": [{"t": "Numbering release", "h": "https://www.sos.ca.gov/administration/news-releases-and-advisories/2026-news-releases-and-advisories/secretary-state-shirley-n-weber-phd-assigns-numbers-november-ballot-measures-invites-ballot-arguments"}, {"t": "Qualified measures", "h": "https://www.sos.ca.gov/elections/ballot-measures/qualified-ballot-measures"}]}, {"id": "prop37", "tab": "measures", "kind": "measure", "office": "Proposition 37", "pick": "Yes", "conf": "Low", "ownerWhy": "Up to $25 billion in loans would help some buyers with a down payment. The official summary says the buyers pay the money back, not the state, unlike Proposition 1. The setup is new, so this is Low. Push back if a taxpayer backup is hiding in the fine print.", "publicWhy": "Up to $25 billion in loans would help some buyers with a down payment. The official summary says the buyers pay the money back, not the state, unlike Proposition 1. The setup is new, so confidence is low. The open question is a taxpayer backup that was not in the summary.", "ballot": "", "how": "", "publicHow": "", "sens": "", "settle": "What would settle it. Whether repayment depends on a taxpayer backstop the official summary does not show.", "extra": "Initiative statute. Push back if the repayment promise depends on a taxpayer backstop the summary does not show.", "sources": [{"t": "Numbering release", "h": "https://www.sos.ca.gov/administration/news-releases-and-advisories/2026-news-releases-and-advisories/secretary-state-shirley-n-weber-phd-assigns-numbers-november-ballot-measures-invites-ballot-arguments"}, {"t": "Qualified measures", "h": "https://www.sos.ca.gov/elections/ballot-measures/qualified-ballot-measures"}]}, {"id": "prop38", "tab": "measures", "kind": "measure", "office": "Proposition 38", "pick": "No", "conf": "Medium", "ownerWhy": "The state would borrow $8.4 billion for disease research, about $500 million a year for 25 years, paid by taxpayers. Drugs developed with the money would have to be sold cheaper in California. That purpose is real, so this is Medium rather than a firmer no.", "publicWhy": "The state would borrow $8.4 billion for disease research, about $500 million a year for 25 years, paid by taxpayers. Drugs developed with the money would have to be sold cheaper in California. That purpose is real, so the measure tests land on No, at Medium rather than a firmer no.", "ballot": "", "how": "", "publicHow": "", "sens": "", "settle": "", "extra": "Initiative statute. Half the money goes to a University of California-affiliated institute and half to grants.", "sources": [{"t": "Numbering release", "h": "https://www.sos.ca.gov/administration/news-releases-and-advisories/2026-news-releases-and-advisories/secretary-state-shirley-n-weber-phd-assigns-numbers-november-ballot-measures-invites-ballot-arguments"}, {"t": "Qualified measures", "h": "https://www.sos.ca.gov/elections/ballot-measures/qualified-ballot-measures"}]}, {"id": "prop39", "tab": "measures", "kind": "measure", "office": "Proposition 39", "pick": "Yes", "conf": "Medium", "ownerWhy": "Every voter would show a government ID at the polls, or the last four digits on a mail ballot, and the state would have to give an ID to anyone who asks. One ID rule for everyone matches this voter’s preference for the same rules for all. Cost, and the chance a legal voter is turned away, keep this at Medium.", "publicWhy": "Every voter would show a government ID at the polls, or the last four digits on a mail ballot, and the state would have to give an ID to anyone who asks. One ID rule for everyone matches the preference for the same rules for all. Cost, and the chance a legal voter is turned away, keep this at Medium.", "ballot": "", "how": "", "publicHow": "", "sens": "", "settle": "", "extra": "Initiative constitutional amendment. The analyst’s estimate is tens of millions of dollars one time, and ongoing costs from the tens of millions to the low hundreds of millions. This pass did not review evidence about how often a lawful voter is turned away.", "sources": [{"t": "Numbering release", "h": "https://www.sos.ca.gov/administration/news-releases-and-advisories/2026-news-releases-and-advisories/secretary-state-shirley-n-weber-phd-assigns-numbers-november-ballot-measures-invites-ballot-arguments"}, {"t": "Qualified measures", "h": "https://www.sos.ca.gov/elections/ballot-measures/qualified-ballot-measures"}]}, {"id": "prop40", "tab": "measures", "kind": "measure", "office": "Proposition 40", "pick": "No", "conf": "Medium", "ownerWhy": "A one-time tax of up to 5 percent would hit assets over $1 billion, and that money would sit outside the state’s spending limit. A new tax plus a way around the spending cap fails here. A San Ramon news guide calls it union-sponsored. It is one time and hits a narrow group, so this is Medium.", "publicWhy": "A one-time tax of up to 5 percent would hit assets over $1 billion, and that money would sit outside the state’s spending limit. A new tax plus a way around the spending cap fails the fiscal tests. A San Ramon news guide calls it union-sponsored. It is one time and hits a narrow group, so this is Medium.", "ballot": "", "how": "", "publicHow": "", "sens": "", "settle": "", "extra": "Initiative constitutional amendment and statute. The analyst’s estimate says the tax would raise tens of billions over several years and that income-tax revenue would likely fall afterward. Ninety percent of the revenue is for health care and 10 percent for food assistance or education.", "sources": [{"t": "Numbering release", "h": "https://www.sos.ca.gov/administration/news-releases-and-advisories/2026-news-releases-and-advisories/secretary-state-shirley-n-weber-phd-assigns-numbers-november-ballot-measures-invites-ballot-arguments"}, {"t": "Qualified measures", "h": "https://www.sos.ca.gov/elections/ballot-measures/qualified-ballot-measures"}, {"t": "San Ramon Patch voter guide", "h": "https://patch.com/california/sanramon/san-ramon-voter-guide-2026-whats-ballot-voting-more"}]}, {"id": "prop41", "tab": "measures", "kind": "measure", "office": "Proposition 41", "pick": "Yes", "conf": "High", "ownerWhy": "New special taxes would need an audit of the programs they pay for, before the vote and after. New state taxes could not dodge the spending limit, including taxes on the same ballot. It does not create a tax, and nothing of similar weight points the other way.", "publicWhy": "New special taxes would need an audit of the programs they pay for, before the vote and after. New state taxes could not dodge the spending limit, including taxes on the same ballot. It does not create a tax, and nothing of similar weight points the other way.", "ballot": "", "how": "", "publicHow": "", "sens": "", "settle": "", "extra": "Initiative constitutional amendment. The analyst says the net fiscal effect is unknown. That is uncertainty about magnitude, not a test pointing the other way.", "sources": [{"t": "Numbering release", "h": "https://www.sos.ca.gov/administration/news-releases-and-advisories/2026-news-releases-and-advisories/secretary-state-shirley-n-weber-phd-assigns-numbers-november-ballot-measures-invites-ballot-arguments"}, {"t": "Qualified measures", "h": "https://www.sos.ca.gov/elections/ballot-measures/qualified-ballot-measures"}]}, {"id": "prop42", "tab": "measures", "kind": "measure", "office": "Proposition 42", "pick": "Yes", "conf": "High", "ownerWhy": "The state could not add a new tax on things people own, including retirement accounts and investments, or certain taxes that reach backward, including measures on this ballot. Less revenue later is the point of the rule, not a reason to vote no.", "publicWhy": "The state could not add a new tax on things people own, including retirement accounts and investments, or certain taxes that reach backward, including measures on this ballot. Less revenue later is the point of the rule, not a reason to vote no.", "ballot": "", "how": "", "publicHow": "", "sens": "", "settle": "", "extra": "Initiative constitutional amendment. The three tests are: no new tax of this kind, no retroactive tax of the kind described, and the rule covers same-ballot measures.", "sources": [{"t": "Numbering release", "h": "https://www.sos.ca.gov/administration/news-releases-and-advisories/2026-news-releases-and-advisories/secretary-state-shirley-n-weber-phd-assigns-numbers-november-ballot-measures-invites-ballot-arguments"}, {"t": "Qualified measures", "h": "https://www.sos.ca.gov/elections/ballot-measures/qualified-ballot-measures"}]}, {"id": "prop43", "tab": "measures", "kind": "measure", "office": "Proposition 43", "pick": "Yes", "conf": "Medium", "ownerWhy": "Starting in 2027, a local special tax would need a two-thirds vote, including taxes placed by voters, with some exceptions. A higher bar for new local taxes matches this voter. The same hurdle would bind citizen initiatives, not only city halls, which keeps this at Medium.", "publicWhy": "Starting in 2027, a local special tax would need a two-thirds vote, including taxes placed by voters, with some exceptions. A higher bar for new local taxes matches the framework. The same hurdle would bind citizen initiatives, not only city halls, which keeps this at Medium.", "ballot": "", "how": "", "publicHow": "", "sens": "", "settle": "", "extra": "Legislative constitutional amendment. The qualified-list title says it limits voters’ ability to raise local revenue.", "sources": [{"t": "Numbering release", "h": "https://www.sos.ca.gov/administration/news-releases-and-advisories/2026-news-releases-and-advisories/secretary-state-shirley-n-weber-phd-assigns-numbers-november-ballot-measures-invites-ballot-arguments"}, {"t": "Qualified measures", "h": "https://www.sos.ca.gov/elections/ballot-measures/qualified-ballot-measures"}]}, {"id": "prop44", "tab": "measures", "kind": "measure", "office": "Proposition 44", "pick": "Yes", "conf": "Low", "ownerWhy": "Certain nonprofit clinics would have to spend at least 90 percent of revenue on the service itself, with penalties if they fall short. That pushes money toward care. Whether 90 percent is a workable line was not shown, and a local guide says the measure is union-backed, with leftover penalties usable for clinic-worker training. I am not confident.", "publicWhy": "Certain nonprofit clinics would have to spend at least 90 percent of revenue on the service itself, with penalties if they fall short. That pushes money toward care. Whether 90 percent is a workable line was not shown, and a local guide says the measure is union-backed, with leftover penalties usable for clinic-worker training. Confidence is low.", "ballot": "", "how": "", "publicHow": "", "sens": "", "settle": "What would settle it. Whether 90 percent is a workable line, and how the penalty fund would work.", "extra": "Initiative statute. San Ramon Patch describes the measure as union-backed and says penalties that are not refunded after five years can fund clinic-worker training, recruitment, and retention. The analyst’s estimate is state cost up to the low tens of millions a year, much of it covered by fees and penalties.", "sources": [{"t": "Numbering release", "h": "https://www.sos.ca.gov/administration/news-releases-and-advisories/2026-news-releases-and-advisories/secretary-state-shirley-n-weber-phd-assigns-numbers-november-ballot-measures-invites-ballot-arguments"}, {"t": "Qualified measures", "h": "https://www.sos.ca.gov/elections/ballot-measures/qualified-ballot-measures"}, {"t": "San Ramon Patch voter guide", "h": "https://patch.com/california/sanramon/san-ramon-voter-guide-2026-whats-ballot-voting-more"}]}, {"id": "prop45", "tab": "measures", "kind": "measure", "office": "Proposition 45", "pick": "Yes", "conf": "Medium", "ownerWhy": "Environmental review would speed up for some housing, roads, water, health, and clean-energy projects, with shorter court fights. Faster housing review matches this voter’s preference for more homes. Narrower court review is a fairness concern the other way, so this is Medium.", "publicWhy": "Environmental review would speed up for some housing, roads, water, health, and clean-energy projects, with shorter court fights. Faster housing review matches a preference for more homes. Narrower court review is a fairness concern the other way, so this is Medium.", "ballot": "", "how": "", "publicHow": "", "sens": "", "settle": "", "extra": "Initiative statute. The analyst expects implementation costs in the tens of millions a year at first, likely net savings later, and an uncertain court effect.", "sources": [{"t": "Numbering release", "h": "https://www.sos.ca.gov/administration/news-releases-and-advisories/2026-news-releases-and-advisories/secretary-state-shirley-n-weber-phd-assigns-numbers-november-ballot-measures-invites-ballot-arguments"}, {"t": "Qualified measures", "h": "https://www.sos.ca.gov/elections/ballot-measures/qualified-ballot-measures"}]}, {"id": "rtm", "tab": "measures", "kind": "measure", "office": "Measure RTM", "pick": "No", "conf": "Medium", "ownerWhy": "Contra Costa would add a half-cent sales tax for 14 years, about $980 million a year, to avoid big transit cuts and to pay for safety, repairs, and oversight. This voter is skeptical of a new sales tax used to fill an operating hole. Riders and the repairs are a real benefit, so this is Medium.", "publicWhy": "Contra Costa would add a half-cent sales tax for 14 years, about $980 million a year, to avoid big transit cuts and to pay for safety, repairs, and oversight. The framework is skeptical of a new sales tax used to fill an operating hole. Riders and the repairs are a real benefit, so this is Medium.", "ballot": "", "how": "", "publicHow": "", "sens": "", "settle": "", "extra": "The county counsel’s analysis says the district was created by Senate Bill 63 (2025) and covers Alameda, Contra Costa, San Mateo, Santa Clara, and San Francisco. The San Francisco rate in that analysis is one percent. This pass did not review the yes and no campaign treasuries.", "sources": [{"t": "Contra Costa measure page", "h": "https://www.contracostavote.gov/m9001-en-2/"}]}], "equalExpect": {"governor": {"leader": "Hilton", "label": "Medium", "a": "53.57", "b": "48.57"}, "ltgov": {"leader": "Romero", "label": "Low", "a": "53.57", "b": "50.00"}, "sos": {"leader": "Weber", "label": "Low", "a": "55.00", "b": "52.86"}, "controller": {"leader": "No pick", "label": "No pick", "a": "55.71", "b": "54.29"}, "treasurer": {"leader": "Kounalakis", "label": "Low", "a": "52.14", "b": "47.86"}, "ag": {"leader": "Bonta", "label": "Medium", "a": "62.14", "b": "47.14"}, "insurance": {"leader": "Allen", "label": "Medium", "a": "51.14", "b": "42.86"}, "boe": {"leader": "Pimentel", "label": "Medium", "a": "57.14", "b": "50.00"}, "ca10": {"leader": "No pick", "label": "No pick", "a": "49.29", "b": "47.86"}, "ad16": {"leader": "Bauer-Kahan", "label": "Medium", "a": "54.29", "b": "44.29"}, "spi": {"leader": "Shaw", "label": "Medium", "a": "55.00", "b": "47.14"}}}</script>
<script>
(function () {
  var DATA = JSON.parse(document.getElementById("payload").textContent);
  var OWNER = DATA.ownerWeights.slice();
  var EQUAL = [0, 0, 0, 0, 0, 0, 0].map(function () { return 100 / 7; });
  var races = {};
  DATA.races.forEach(function (r) { races[r.id] = r; });
  var items = DATA.items;
  var byId = {};
  items.forEach(function (it) { byId[it.id] = it; });

  var mode = "public";
  var unlocked = false;
  var tab = "offices";
  var weights = EQUAL.slice();
  var openId = null;
  var lastFocus = null;
  var lockedY = 0;
  var first = true;

  function composite(scores, w) {
    var s = 0;
    for (var i = 0; i < scores.length; i++) s += scores[i] * w[i];
    return s / 100;
  }
  function fmt(n) { return (Math.round(n * 100) / 100).toFixed(2); }
  function fmtW(n) {
    var r = Math.round(n * 10) / 10;
    if (Math.abs(r - Math.round(r)) < 0.05) return String(Math.round(r));
    return r.toFixed(1);
  }
  function labelFor(gap, strong) {
    if (gap <= 2.0000001) return { k: "nopick", t: "No pick" };
    if (gap < 5) return { k: "low", t: "Low" };
    if (gap >= 15 && strong) return { k: "high", t: "High" };
    return { k: "med", t: "Medium" };
  }
  function scoreRace(race, w) {
    var ranked = race.candidates.map(function (c, i) {
      return { i: i, c: c, v: composite(c.scores, w) };
    }).sort(function (a, b) { return b.v - a.v; });
    var gap = ranked[0].v - ranked[1].v;
    return { ranked: ranked, gap: gap, lab: labelFor(gap, race.strong) };
  }
  function baseline(which) { return (which === "owner" ? OWNER : EQUAL).slice(); }
  function sameWeights(a, b) {
    for (var i = 0; i < 7; i++) if (Math.abs(a[i] - b[i]) > 0.05) return false;
    return true;
  }
  function storageGet(key) {
    try {
      var raw = localStorage.getItem(key);
      if (typeof raw !== "string" || raw.length > 400) return null;
      return raw;
    } catch (e) { return null; }
  }
  function loadWeights(which) {
    try {
      var raw = storageGet(which === "owner" ? "bguide-w-owner" : "bguide-w-public");
      if (!raw || raw.length > 200) return baseline(which);
      var arr = JSON.parse(raw);
      if (!Array.isArray(arr) || arr.length !== 7) return baseline(which);
      for (var i = 0; i < 7; i++) {
        if (typeof arr[i] !== "number" || !isFinite(arr[i]) || arr[i] < 0 || arr[i] > 100) return baseline(which);
      }
      var sum = arr.reduce(function (a, b) { return a + b; }, 0);
      if (!(sum > 0) || !isFinite(sum)) return baseline(which);
      if (Math.abs(sum - 100) > 0.5) arr = arr.map(function (n) { return n / sum * 100; });
      return arr;
    } catch (e) { return baseline(which); }
  }
  function persist() {
    try {
      var key = mode === "owner" ? "bguide-w-owner" : "bguide-w-public";
      if (sameWeights(weights, baseline(mode))) localStorage.removeItem(key);
      else localStorage.setItem(key, JSON.stringify(weights));
    } catch (e) {}
  }
  function applyLock(index, desired) {
    desired = Math.max(0, Math.min(100, desired));
    var prevW = weights.slice();
    var others = [];
    var osum = 0;
    for (var i = 0; i < 7; i++) if (i !== index) { others.push(i); osum += prevW[i]; }
    var remain = 100 - desired;
    var next = prevW.slice();
    if (remain <= 0) {
      next = [0, 0, 0, 0, 0, 0, 0];
      next[index] = 100;
    } else if (osum <= 0.0001) {
      var share = remain / others.length;
      next[index] = desired;
      others.forEach(function (i) { next[i] = share; });
    } else {
      next[index] = desired;
      others.forEach(function (i) { next[i] = prevW[i] / osum * remain; });
    }
    weights = next;
  }
  function viewOf(item) {
    if (item.kind === "race") {
      var R = scoreRace(races[item.id], weights);
      var base = scoreRace(races[item.id], baseline(mode));
      var abstain = R.lab.t === "No pick";
      var basePick = base.lab.t === "No pick" ? "No pick" : base.ranked[0].c.short;
      var pick = abstain ? "No pick" : R.ranked[0].c.short;
      return {
        pick: pick,
        conf: abstain ? "" : R.lab.t,
        confK: R.lab.k,
        changed: pick !== basePick || (!abstain && R.lab.t !== base.lab.t && base.lab.t !== "No pick"),
        R: R,
        runner: R.ranked[1].c.short
      };
    }
    return { pick: item.pick, conf: item.conf, confK: item.conf === "High" ? "high" : item.conf === "Low" ? "low" : item.conf === "Medium" ? "med" : "", changed: false, R: null, runner: "" };
  }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function pill(k, t) {
    var map = { High: "high", Medium: "med", Low: "low" };
    return el("span", "pill " + (map[t] || k), t);
  }

  var SHORT = {
    prop1: "Housing bond",
    prop2: "Rainy-day fund",
    prop3: "High-income tax",
    prop4: "Public campaign money",
    prop5: "Recall replacement",
    prop37: "Down-payment loans",
    prop38: "Disease research",
    prop39: "Voter identification",
    prop40: "Billionaire tax",
    prop41: "Tax audits",
    prop42: "Tax on what you own",
    prop43: "Local tax vote",
    prop44: "Clinic spending",
    prop45: "Faster review",
    rtm: "Transit sales tax"
  };
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var deckOn = false;
  var deckIndex = 0;
  var counted = false;
  function pacificDay(now) {
    var parts = new Intl.DateTimeFormat("en-US", {
      timeZone: "America/Los_Angeles",
      year: "numeric",
      month: "2-digit",
      day: "2-digit"
    }).formatToParts(now);
    var y = 0, m = 0, day = 0;
    parts.forEach(function (p) {
      if (p.type === "year") y = +p.value;
      if (p.type === "month") m = +p.value;
      if (p.type === "day") day = +p.value;
    });
    return Date.UTC(y, m - 1, day);
  }
  function daysLabel(now) {
    var election = Date.UTC(2026, 10, 3);
    var today = pacificDay(now || new Date());
    var d = Math.round((election - today) / 86400000);
    if (d > 1) return d + " days to vote";
    if (d === 1) return "1 day to vote";
    if (d === 0) return "Vote today";
    return "Election day has passed";
  }
  function scrollTop(y) {
    window.scrollTo({ top: y, behavior: reduce ? "auto" : "smooth" });
  }
  function shortTitle(item) {
    return SHORT[item.id] || item.office;
  }
  function measureNum(item) {
    var m = item.office.match(/(\d+)/);
    if (m) return m[1];
    return item.id === "rtm" ? "RTM" : "";
  }
  function headline(item, v) {
    if (item.kind === "race") {
      if (v.pick === "No pick") return "Too close for a pick";
      return v.pick + " over " + v.runner;
    }
    if (item.kind === "measure") return (v.pick === "Yes" ? "Yes" : "No") + " on " + item.office.replace("Proposition ", "Prop ");
    return "No pick";
  }

  var TAB_ORDER = ["offices", "measures", "local"];
  function tabIndexOf(name) {
    var i = TAB_ORDER.indexOf(name);
    return i < 0 ? 0 : i;
  }
  function syncTabs() {
    var list = document.getElementById("tablist");
    if (list) list.style.setProperty("--i", String(tabIndexOf(tab)));
    TAB_ORDER.forEach(function (name) {
      var b = document.getElementById("tab-" + name);
      if (!b) return;
      var on = name === tab;
      b.setAttribute("aria-selected", on ? "true" : "false");
      b.tabIndex = on ? 0 : -1;
    });
  }
  function renderChrome() {
    var owner = mode === "owner";
    document.getElementById("lede").textContent = owner ? "My ballot" : "San Ramon ballot";
    document.getElementById("nav-title").textContent = owner ? "My ballot" : "Nov 3";
    document.getElementById("glance-title").textContent = "At a glance";
    document.getElementById("countdown-text").textContent = daysLabel();
    document.getElementById("mode-chip").textContent = owner ? "Saved weights" : "Verified Oct 14";
    document.getElementById("intro").textContent = owner
      ? "Saved weights. Open a card for the reason. Not a prediction, and not an instruction to vote."
      : "Weights start equal. Open a card for the reason. Not a prediction, and not an instruction to vote.";
    var unlockedOn = !!unlocked;
    document.documentElement.setAttribute("data-unlocked", unlockedOn ? "true" : "false");
    var dock = document.getElementById("mode-dock");
    var seg = document.getElementById("viewseg");
    dock.hidden = !unlockedOn;
    seg.hidden = !unlockedOn;
    seg.style.setProperty("--i", owner ? "0" : "1");
    seg.querySelectorAll("button").forEach(function (b) {
      b.setAttribute("aria-pressed", b.getAttribute("data-view") === mode ? "true" : "false");
    });
    syncTabs();
    document.documentElement.setAttribute("data-mode", mode);
  }

  function pill(k, t) {
    var map = { High: "high", Medium: "med", Low: "low" };
    return el("span", "pill " + (map[t] || k), t);
  }
  function check() {
    var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("class", "tick");
    svg.setAttribute("viewBox", "0 0 16 16");
    svg.setAttribute("width", "16");
    svg.setAttribute("height", "16");
    svg.setAttribute("aria-hidden", "true");
    var path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", "M3.2 8.4l3 3.1 6.6-6.8");
    path.setAttribute("fill", "none");
    path.setAttribute("stroke", "currentColor");
    path.setAttribute("stroke-width", "1.8");
    path.setAttribute("stroke-linecap", "round");
    path.setAttribute("stroke-linejoin", "round");
    svg.appendChild(path);
    return svg;
  }
  function extLink(href, text, cls) {
    var a = document.createElement("a");
    if (cls) a.className = cls;
    a.textContent = text == null ? "" : String(text);
    if (typeof href === "string" && href.length < 2000 && /^https:\/\/[^\s]+$/i.test(href)) {
      a.href = href;
      a.rel = "noopener noreferrer";
      a.target = "_blank";
      a.referrerPolicy = "no-referrer";
    }
    return a;
  }

  function fillCard(btn, item) {
    var v = viewOf(item);
    btn.replaceChildren();
    btn.className = item.kind === "race" ? "match row" : item.kind === "measure" ? "measure row" : "quiet row";
    if (item.id === "governor") btn.classList.add("featured");
    if (item.kind === "race") {
      var top = el("div", "match-top");
      top.appendChild(el("span", "eye", item.office));
      if (v.pick === "No pick") top.appendChild(el("span", "pill low pick", "No pick"));
      else if (v.conf) top.appendChild(pill(v.confK, v.conf));
      btn.appendChild(top);
      var duel = el("div", "duel");
      var ranked = v.R.ranked;
      ranked.forEach(function (entry) {
        var win = entry.c.short === v.pick;
        var side = el("div", "side" + (win ? " win" : ""));
        var who = el("span", "who" + (win ? " pick" : "") + (v.changed && win ? " changed" : ""));
        if (win) who.appendChild(check());
        who.appendChild(document.createTextNode(entry.c.short));
        side.appendChild(who);
        side.appendChild(el("span", "score", fmt(entry.v)));
        duel.appendChild(side);
      });
      btn.appendChild(duel);
      var share = (ranked[0].v + ranked[1].v) > 0 ? (ranked[0].v / (ranked[0].v + ranked[1].v)) * 100 : 50;
      var bar = el("div", "bar");
      var fill = el("span", "");
      fill.style.setProperty("--w", share.toFixed(2) + "%");
      bar.appendChild(fill);
      btn.appendChild(bar);
    } else if (item.kind === "measure") {
      btn.appendChild(el("div", "m-num", measureNum(item)));
      var body = el("div", "");
      body.appendChild(el("span", "m-title", shortTitle(item)));
      body.appendChild(el("span", "m-sub", v.conf || ""));
      btn.appendChild(body);
      var vote = el("span", "vote pick " + (v.pick === "Yes" ? "yes" : "no"), v.pick);
      btn.appendChild(vote);
    } else {
      var qtop = el("div", "quiet-top");
      qtop.appendChild(el("span", "eye", item.office));
      qtop.appendChild(el("span", "pill low pick", "No pick"));
      btn.appendChild(qtop);
      btn.appendChild(el("p", "quiet-line", "Check your sample ballot."));
    }
    btn.removeAttribute("aria-label");
  }

  function fillChip(btn, item) {
    var v = viewOf(item);
    btn.replaceChildren();
    var kind = item.kind === "measure" ? (v.pick === "Yes" ? "yes" : "no") : "";
    btn.className = "film" + (kind ? " " + kind : "");

  }
  function sourceCount(item) {
    var n = item.sources ? item.sources.length : 0;
    return n === 1 ? "1 source" : n + " sources";
  }
  function fillDeckCard(card, item, v) {
    var head = el("div", "deck-head");
    if (item.kind === "measure") {
      head.appendChild(el("p", "deck-kicker", "Measure"));
      head.appendChild(el("p", "deck-num", measureNum(item)));
      head.appendChild(el("p", "deck-measure-title", shortTitle(item)));
      var vote = el("p", "deck-vote " + (v.pick === "Yes" ? "yes" : "no"), v.pick === "Yes" ? "Yes" : "No");
      head.appendChild(vote);
      if (v.conf) {
        var meta = el("div", "deck-meta");
        meta.appendChild(pill(v.confK, v.conf));
        head.appendChild(meta);
      }
    } else if (item.tab === "local") {
      head.appendChild(el("p", "deck-kicker", item.office));
      head.appendChild(el("h2", "", "No pick"));
      card.appendChild(head);
      var names = ballotNames(item.ballot);
      if (names.length) {
        var list = el("ul", "deck-names");
        names.forEach(function (name) { list.appendChild(el("li", "", name)); });
        card.appendChild(list);
      }
      card.appendChild(el("p", "deck-note", "Check your sample ballot"));
      head = null;
    } else {
      head.appendChild(el("p", "deck-kicker", item.office));
      head.appendChild(el("h2", "", headline(item, v)));
      if (v.conf) {
        var badge = el("div", "deck-meta");
        badge.appendChild(pill(v.confK, v.conf));
        head.appendChild(badge);
      }
    }
    if (head) card.appendChild(head);
    if (item.kind === "race") addMeters(card, v);
    var body = el("div", "deck-body");
    body.appendChild(el("p", "deck-why-kicker", "Why"));
    var scroll = el("div", "deck-scroll");
    var why = el("div", "deck-why");
    why.textContent = deckWhy(item, v);
    scroll.appendChild(why);
    var fade = el("div", "deck-fade");
    fade.hidden = true;
    scroll.appendChild(fade);
    body.appendChild(scroll);
    card.appendChild(body);
    card.appendChild(el("p", "deck-foot", sourceCount(item)));
  }
  function syncDeckFade(card) {
    var why = card.querySelector(".deck-why");
    var fade = card.querySelector(".deck-fade");
    if (!why || !fade) return;
    var more = why.scrollHeight - why.scrollTop - why.clientHeight > 8;
    fade.hidden = !more;
  }
  function renderDeck() {
    var stage = document.getElementById("deck-stage");
    var n = items.length;
    document.getElementById("deck-count").textContent = (deckIndex + 1) + " of " + n;
    var bar = document.getElementById("deck-progress");
    if (bar) bar.style.transform = "scaleX(" + ((deckIndex + 1) / n) + ")";
    stage.replaceChildren();
    [2, 1, 0].forEach(function (depth) {
      var item = items[(deckIndex + depth) % n];
      var v = viewOf(item);
      var card = el("div", "deck-card " + (depth === 0 ? "front" : depth === 1 ? "back1" : "back2"));
      if (depth !== 0) card.setAttribute("aria-hidden", "true");
      fillDeckCard(card, item, v);
      if (depth === 0) {
        card.addEventListener("keydown", function (e) {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openDetail(item.id); }
        });
        bindDeckSwipe(card, item.id);
        card.querySelector(".deck-why").addEventListener("scroll", function () { syncDeckFade(card); }, { passive: true });
      }
      stage.appendChild(card);
    });
    requestAnimationFrame(function () {
      stage.querySelectorAll(".meter-track > span").forEach(function (s) { s.classList.add("go"); });
      var front = stage.querySelector(".front");
      if (front) syncDeckFade(front);
    });
  }
  function bindDeckSwipe(card, id) {
    var drag = null;
    card.addEventListener("pointerdown", function (e) {
      if (e.target.closest("a, button")) return;
      drag = { x: e.clientX, y: e.clientY, id: e.pointerId, locked: false, scroll: false };
      card.dataset.drag = "0";
    });
    card.addEventListener("pointermove", function (e) {
      if (!drag || drag.id !== e.pointerId || reduce) return;
      var dx = e.clientX - drag.x;
      var dy = e.clientY - drag.y;
      if (!drag.locked) {
        if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
        drag.locked = true;
        if (Math.abs(dy) > Math.abs(dx) && e.target.closest(".deck-why")) {
          drag.scroll = true;
          return;
        }
        try { card.setPointerCapture(e.pointerId); } catch (err) {}
        card.style.transition = "none";
      }
      if (drag.scroll) return;
      card.dataset.drag = "1";
      card.style.transform = "translate3d(" + dx + "px, 0, 0) rotate(" + (dx / 42) + "deg)";
    });
    function end(e) {
      if (!drag || (e && drag.id !== e.pointerId)) return;
      var dx = e.clientX - drag.x;
      var scrolled = drag.scroll;
      drag = null;
      if (dx <= -64) { card.style.transform = ""; stepDeck(1); return; }
      if (dx >= 64) { card.style.transform = ""; stepDeck(-1); return; }
      if (scrolled || card.dataset.drag === "1") {
        card.style.transition = "transform 0.48s cubic-bezier(0.22, 1.15, 0.36, 1)";
        card.style.transform = "";
        return;
      }
      card.style.transform = "";
      if (!e.target.closest(".deck-why")) openDetail(id);
    }
    card.addEventListener("pointerup", end);
    card.addEventListener("pointercancel", function () {
      drag = null;
      card.style.transition = "";
      card.style.transform = "";
    });
  }
  function stepDeck(dir) {
    var stage = document.getElementById("deck-stage");
    var fromStage = stage && stage.contains(document.activeElement);
    deckIndex = (deckIndex + dir + items.length) % items.length;
    renderDeck();
    if (fromStage) {
      var card = document.querySelector("#deck-stage .front");
      if (card) card.focus();
    }
  }
  function openDeck() {
    deckOn = true;
    document.getElementById("deck").hidden = false;
    document.documentElement.classList.add("deck-open");
    renderDeck();
    syncInert();
    document.getElementById("deck-close").focus();
  }
  function closeDeck() {
    deckOn = false;
    document.getElementById("deck").hidden = true;
    document.documentElement.classList.remove("deck-open");
    syncInert();
    var opener = document.getElementById("flip-open");
    if (opener) opener.focus();
  }

  document.getElementById("flip-open").addEventListener("click", openDeck);
  document.getElementById("deck-close").addEventListener("click", closeDeck);
  document.getElementById("deck-back").addEventListener("click", function () { stepDeck(-1); });
  document.getElementById("deck-next").addEventListener("click", function () { stepDeck(1); });
  document.getElementById("adjust").addEventListener("click", openAdjust);
  document.getElementById("detail-close").addEventListener("click", hideSheets);
  document.getElementById("adjust-close").addEventListener("click", hideSheets);
  document.getElementById("adjust-reset").addEventListener("click", function () {
    weights = baseline(mode);
    persist();
    updatePicks();
    updateAdjust();
    if (openId) fillDetail(byId[openId], false);
    document.getElementById("live").textContent = "Weights reset.";
  });
  document.getElementById("scrim").addEventListener("click", hideSheets);
  document.getElementById("scrim").addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
  document.getElementById("detail-body").addEventListener("scroll", refreshFades, { passive: true });
  document.getElementById("adjust-body").addEventListener("scroll", refreshFades, { passive: true });
  document.addEventListener("touchmove", function (e) {
    if (!document.documentElement.classList.contains("sheet-open")) return;
    if (!e.target.closest(".sheet-body")) e.preventDefault();
  }, { passive: false });
  window.addEventListener("resize", function () {
    layoutReady = false;
    refreshFades();
  });
  document.addEventListener("keydown", function (e) {
    var sheet = visibleSheet();
    if (e.key === "Escape") {
      if (sheet) hideSheets();
      else if (deckOn) closeDeck();
      return;
    }
    if (e.key === "Tab") {
      var root = sheet || (deckOn ? document.getElementById("deck") : null);
      if (root) trapTab(e, root);
      return;
    }
    if (sheet) return;
    if (deckOn) {
      if (e.key === "ArrowRight") { e.preventDefault(); stepDeck(1); }
      if (e.key === "ArrowLeft") { e.preventDefault(); stepDeck(-1); }
      return;
    }
    if ((e.key === "ArrowRight" || e.key === "ArrowLeft" || e.key === "Home" || e.key === "End") && e.target && e.target.getAttribute("role") === "tab") {
      var order = ["offices", "measures", "local"];
      var i = order.indexOf(e.target.id.replace("tab-", ""));
      if (i < 0) return;
      var next = e.key === "Home" ? order[0] : e.key === "End" ? order[2] : e.key === "ArrowRight" ? order[(i + 1) % 3] : order[(i + 2) % 3];
      e.preventDefault();
      var btn = document.getElementById("tab-" + next);
      btn.focus();
      btn.click();
    }
  });
  document.getElementById("viewseg").addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b || !unlocked) return;
    var next = b.getAttribute("data-view");
    if (next !== "owner" && next !== "public") return;
    mode = next;
    try { localStorage.setItem("bguide-view", mode); } catch (err) {}
    weights = loadWeights(mode);
    openId = null;
    hideSheets();
    renderList();
  });
  ["offices", "measures", "local"].forEach(function (name) {
    document.getElementById("tab-" + name).addEventListener("click", function () {
      var from = tab;
      tab = name;
      syncTabs();
      lockSpy = true;
      scrollToSection(name, from);
      setTimeout(function () { lockSpy = false; onScroll(); }, 700);
    });
  });
  bindSwipe(document.getElementById("detail"), document.getElementById("detail-head"));
  bindSwipe(document.getElementById("adjust-sheet"), document.getElementById("adjust-head"));

  var nav = document.getElementById("nav");
  var large = document.getElementById("large");
  var lockSpy = false;
  var scrollQueued = false;
  var chromeCollapsed = null;
  var tallyRows = [];
  var tallySeen = -1;
  var tallyPct = -1;
  var cardTops = [];
  var sectionAt = [];
  var collapseAt = 0;
  var maxScroll = 1;
  var layoutReady = false;
  var swapGen = 0;
  function stuckBottom() {
    var stick = document.getElementById("stick");
    var top = parseFloat(getComputedStyle(stick).top) || 0;
    return top + stick.offsetHeight;
  }
  function measureLayout() {
    if (!tallyRows.length) tallyRows = Array.prototype.slice.call(document.querySelectorAll("#sections .row"));
    var y = window.scrollY;
    var viewMark = window.innerHeight * 0.82;
    cardTops = new Array(tallyRows.length);
    for (var i = 0; i < tallyRows.length; i++) {
      cardTops[i] = tallyRows[i].getBoundingClientRect().top + y - viewMark;
    }
    var stick = document.getElementById("stick");
    var line = (parseFloat(getComputedStyle(stick).top) || 0) + stick.offsetHeight + 20;
    sectionAt = new Array(TAB_ORDER.length);
    for (var s = 0; s < TAB_ORDER.length; s++) {
      var sec = document.getElementById("sec-" + TAB_ORDER[s]);
      sectionAt[s] = sec ? sec.getBoundingClientRect().top + y - line : 1e9;
    }
    collapseAt = large.getBoundingClientRect().bottom + y - nav.getBoundingClientRect().bottom + 2;
    maxScroll = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
    layoutReady = tallyRows.length > 0;
  }
  function seenAt(y) {
    var lo = 0;
    var hi = cardTops.length;
    while (lo < hi) {
      var mid = (lo + hi) >> 1;
      if (cardTops[mid] < y) lo = mid + 1;
      else hi = mid;
    }
    return lo;
  }
  function scrollToSection(name, fromName) {
    var sec = document.getElementById("sec-" + name);
    if (!sec) return;
    var y = sec.getBoundingClientRect().top + window.scrollY - stuckBottom() - 8;
    var target = Math.max(0, y);
    var sections = document.getElementById("sections");
    var dir = 0;
    if (fromName && fromName !== name) dir = tabIndexOf(name) > tabIndexOf(fromName) ? 1 : -1;
    if (sections && dir && !reduce) {
      swapGen += 1;
      var gen = swapGen;
      sections.style.setProperty("--shift", (dir * 16) + "px");
      sections.classList.add("is-swap");
      sections.style.willChange = "transform, opacity";
      void sections.offsetWidth;
      window.scrollTo(0, target);
      requestAnimationFrame(function () {
        if (gen !== swapGen) return;
        sections.classList.remove("is-swap");
      });
      setTimeout(function () {
        if (gen !== swapGen) return;
        sections.classList.remove("is-swap");
        sections.style.willChange = "";
      }, 560);
    } else {
      window.scrollTo(0, target);
    }
  }
  function applyChromeColor(collapsed) {
    var meta = document.querySelector('meta[name="theme-color"]');
    if (!meta) return;
    var dark = document.documentElement.getAttribute("data-theme") === "dark";
    meta.setAttribute("content", !collapsed ? "#0c1424" : (dark ? "#000000" : "#e8eaef"));
  }
  function paintTally() {
    var fill = document.getElementById("tally-fill");
    var label = document.getElementById("tally-label");
    if (!fill || !label) return;
    if (!layoutReady) measureLayout();
    var y = window.scrollY;
    var rounded = Math.round(Math.max(0, Math.min(100, (y / maxScroll) * 100)) * 10) / 10;
    if (rounded !== tallyPct) {
      tallyPct = rounded;
      fill.style.width = rounded + "%";
    }
    var seen = seenAt(y);
    if (seen !== tallySeen) {
      tallySeen = seen;
      label.textContent = seen + " of " + tallyRows.length;
    }
  }
  function readScroll() {
    scrollQueued = false;
    if (!layoutReady) measureLayout();
    var y = window.scrollY;
    var collapsed = y > collapseAt;
    if (collapsed !== chromeCollapsed) {
      chromeCollapsed = collapsed;
      nav.classList.toggle("is-collapsed", collapsed);
      applyChromeColor(collapsed);
    }
    paintTally();
    if (lockSpy) return;
    var current = "offices";
    for (var n = 0; n < sectionAt.length; n++) {
      if (y >= sectionAt[n]) current = TAB_ORDER[n];
    }
    if (current !== tab) {
      tab = current;
      syncTabs();
    }
  }
  function onScroll() {
    if (scrollQueued) return;
    scrollQueued = true;
    requestAnimationFrame(readScroll);
  }
  window.addEventListener("scroll", onScroll, { passive: true });

  bootMode();
  syncTheme();
  renderList();
  onScroll();

  var openQ = /(?:^|[?&])open=([^&]+)/.exec(location.search);
  if (openQ && openQ[1].length <= 64) {
    var which = "";
    try { which = decodeURIComponent(openQ[1]); } catch (e) { which = ""; }
    if (which === "adjust") openAdjust();
    else if (/^[a-z0-9]+$/.test(which) && byId[which]) openDetail(which);
  }
  var tabQ = /(?:^|[?&])tab=([^&]+)/.exec(location.search);
  if (tabQ && (tabQ[1] === "offices" || tabQ[1] === "measures" || tabQ[1] === "local")) {
    tab = tabQ[1];
    renderList();
  }

  var ok = true;
  var msgs = [];
  DATA.races.forEach(function (race) {
    race.candidates.forEach(function (c) {
      var v = composite(c.scores, OWNER);
      if (Math.abs(v - c.expect) > 0.001) { ok = false; msgs.push(race.id + " " + c.short); }
    });
    var R = scoreRace(race, OWNER);
    if (R.ranked[0].c.short !== race.defaultLeader) { ok = false; msgs.push("lead " + race.id); }
    if (R.lab.t !== race.defaultLabel) { ok = false; msgs.push("lab " + race.id + " " + R.lab.t); }
    var E = scoreRace(race, EQUAL);
    var exp = DATA.equalExpect[race.id];
    var got = E.lab.t === "No pick" ? "No pick" : E.ranked[0].c.short;
    if (got !== exp.leader || E.lab.t !== exp.label || fmt(E.ranked[0].v) !== exp.a || fmt(E.ranked[1].v) !== exp.b) {
      ok = false;
      msgs.push("eq " + race.id + " " + got + " " + E.lab.t + " " + fmt(E.ranked[0].v) + " " + fmt(E.ranked[1].v));
    }
  });
  function sens(index, delta) {
    var w = OWNER.slice();
    w[index] = Math.max(0, w[index] + delta);
    var sum = w.reduce(function (a, b) { return a + b; }, 0);
    return w.map(function (x) { return x / sum * 100; });
  }
  function byShort(race, short) {
    for (var i = 0; i < race.candidates.length; i++) if (race.candidates[i].short === short) return race.candidates[i];
  }
  var treas = races.treasurer;
  var wn = sens(5, 10);
  if (fmt(composite(byShort(treas, "Hawks").scores, wn)) !== "48.86" || fmt(composite(byShort(treas, "Kounalakis").scores, wn)) !== "49.45") {
    ok = false; msgs.push("sens");
  }
  var gw = sens(5, 10);
  if (fmt(composite(byShort(races.governor, "Hilton").scores, gw)) !== "58.59" || fmt(composite(byShort(races.governor, "Becerra").scores, gw)) !== "44.68") {
    ok = false; msgs.push("govsens");
  }
  document.documentElement.setAttribute("data-math", ok ? "pass" : "fail");
  if (!ok) {
    var banner = el("p", "mathfail", "Math check failed: " + msgs.join(" | "));
    document.body.insertBefore(banner, document.body.firstChild);
  }
  document.documentElement.setAttribute("data-gov", document.querySelector("#row-governor .pick").textContent);
  document.documentElement.setAttribute("data-sos", document.querySelector("#row-sos .pick").textContent);
  document.documentElement.setAttribute("data-ctrl", document.querySelector("#row-controller .pick").textContent);
  document.documentElement.setAttribute("data-treas", document.querySelector("#row-treasurer .pick").textContent);
  document.documentElement.setAttribute("data-ca10", document.querySelector("#row-ca10 .pick").textContent);
  document.documentElement.setAttribute("data-overflow", document.documentElement.scrollWidth > document.documentElement.clientWidth + 1 ? "yes" : "no");
  first = false;
})();
</script>
<noscript><p class="mathfail">This page needs JavaScript to score the races from the weights.</p></noscript>
</body>
</html>
